[project]
name = "instaAutoAI"
version = "0.2.0"
description = "Multi‑agent system using LangGraph and CrewAI with Django backend"
authors = [
    {name = "Your Name", email = "you@example.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10, <3.14"

dependencies = [
    "torch>=2.5.0",
    "torchvision>=0.20.0",
    "torchaudio>=2.5.0",
    "diffusers @ git+https://github.com/huggingface/diffusers",
    "transformers>=4.47.0",
    "accelerate>=1.0.0",
    "huggingface-hub>=0.25.0",
    "Pillow>=10.4.0",
    "langgraph>=1.1.0",
    "crewai>=1.9.0",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "openai>=1.50.0",
    "httpx>=0.27.0",
    "django>=5.1",
    "djangorestframework>=3.15.0",
    "channels>=4.1.0",
    "channels-redis>=4.2.0",
    "daphne>=4.1.0",
    "dj-database-url>=2.0.0",
    "django-filter>=24.0",
    "psycopg[binary]>=3.1.0",
    "celery>=5.3.0",
    "redis>=5.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-django>=4.8.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "factory-boy>=3.3.0",
    "faker>=25.0.0",
    "black>=24.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "django-stubs>=5.0.0",
    "djangorestframework-stubs>=3.15.0",
    "ipython>=8.0.0",
    "django-extensions>=3.2.0",
    "django-debug-toolbar>=4.3.0",
    "werkzeug>=3.0.0",
]

[project.scripts]
run-agent = "my_agents.cli:main"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.development"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.development"
asyncio_mode = "auto"
testpaths = ["apps"]
python_files = ["test_*.py"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"